{{ define "main" }}
<section class="notes-hero fade-in">
  <h1>{{ .Title }}</h1>
  <p>{{ i18n "about_subtitle" }}</p>
</section>

<section class="about-shell fade-in delay-1">
  <article class="about-card">
    {{ .Content }}
  </article>

  <aside class="about-side">
    <article class="stack-card">
      <h2>{{ i18n "features_title" }}</h2>
      <ul>
        {{ range .Params.features }}
        <li>{{ . }}</li>
        {{ end }}
      </ul>
    </article>

    <article class="panel-card">
      <h3>Project</h3>
      <p>Hugo + Bilingual + Responsive</p>
      <p>持续更新中</p>
    </article>
  </aside>
</section>
{{ end }}
