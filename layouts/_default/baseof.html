<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ "assets/css/styles.css" | relURL }}" />
  </head>
  <body>
    <header>
      <div class="nav-wrap">
        <a class="brand" href="{{ "/" | relLangURL }}">{{ .Site.Params.brand }}</a>
        <nav>
          <a href="{{ "/" | relLangURL }}"{{ if .IsHome }} class="active"{{ end }}>{{ i18n "home" }}</a>
          <a href="{{ "/timeline/" | relLangURL }}"{{ if eq .Type "timeline" }} class="active"{{ end }}>{{ i18n "timeline" }}</a>
          <a href="{{ "/posts/" | relLangURL }}"{{ if eq .Section "posts" }} class="active"{{ end }}>{{ i18n "notes" }}</a>
          <a href="{{ "/about/" | relLangURL }}"{{ if eq .Type "about" }} class="active"{{ end }}>{{ i18n "about" }}</a>
        </nav>
        <div class="lang-switch" aria-label="language switcher">
          {{ range .AllTranslations }}
          <a href="{{ .Permalink }}"{{ if eq .Language.Lang $.Site.Language.Lang }} class="is-active" aria-current="true"{{ end }}>{{ .Language.LanguageName }}</a>
          {{ end }}
        </div>
      </div>
    </header>

    <main class="site-shell">
      {{ block "main" . }}{{ end }}
      <footer>
        <p>{{ i18n "footer" }}</p>
      </footer>
    </main>
  </body>
</html>
