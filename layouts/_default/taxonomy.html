{{ define "main" }}
{{ $taxonomyTitle := .Title }}
{{ if eq .Data.Plural "tags" }}{{ $taxonomyTitle = i18n "tags" }}{{ end }}
<h2 class="section-title">{{ $taxonomyTitle }}</h2>
<div class="timeline-month">
  <ul>
    {{ range .Data.Terms.ByCount }}
    <li>
      <a href="{{ .Page.Permalink }}">
        <span class="timeline-title">#{{ .Page.Title }}</span>
        <span class="timeline-date">({{ .Count }})</span>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
